<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produit - Parfums Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================
         HEADER
    =========================== -->

    <header class="product-header">

        <div class="product-header-content">

            <a
                href="index.html"
                class="logo-link"
            >

                <img
                    src="logo.png"
                    alt="Parfums Store"
                    class="logo"
                >

            </a>


            <a
                href="index.html#products"
                class="product-back-link"
            >
                ← Retour aux produits
            </a>

        </div>

    </header>


    <!-- ==========================
         CONTENU
    =========================== -->

    <main class="product-page">

        <section
            id="productDetail"
            class="product-detail-container"
        >
        </section>


        <!-- ==========================
             PANIER
        =========================== -->

        <div class="product-cart-link">

            <a href="index.html">

                🛒
                Voir mon panier

            </a>

        </div>

    </main>


    <!-- ==========================
         FOOTER
    =========================== -->

    <footer>

        <p>
            © 2026 Parfums Store — Tous droits réservés.
        </p>

    </footer>


    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="products.js"></script>

    <script src="produit.js"></script>


</body>

</html>

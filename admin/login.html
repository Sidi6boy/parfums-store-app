<!DOCTYPE html> <html lang="fr"> <head>
    <meta charset="UTF-8">
    
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    
    <title>Administration - Parfums Store</title>
    
    <link rel="stylesheet"
          href="css/admin.css">
    
    </head> <body class="login-page">
    <main class="login-container">
    
        <div class="login-card">
    
            <div class="login-logo">
                PS
            </div>
    
            <h1>Parfums Store</h1>
    
            <p class="login-subtitle">
                Administration
            </p>
    
            <form id="loginForm">
    
                <div class="form-group">
    
                    <label for="username">
                        Nom d'utilisateur
                    </label>
    
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        autocomplete="username"
                        required
                    >
    
                </div>
    
                <div class="form-group">
    
                    <label for="password">
                        Mot de passe
                    </label>
    
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
    
                </div>
    
                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                    id="loginButton"
                >
                    Se connecter
                </button>
    
                <div
                    id="loginMessage"
                    class="message"
                ></div>
    
            </form>
    
        </div>
    
    </main>
    
    <script src="js/login.js"></script>
    
    </body> </html>
